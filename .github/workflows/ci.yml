name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.14"]
        exclude:
          # libsql 0.1.11 publishes a cp314 wheel for manylinux only. On
          # Windows pip falls back to the sdist and the Rust extension build
          # fails on the runner, so this combination cannot be gated until
          # upstream ships a cp314 win_amd64 wheel. macOS + 3.14 also builds
          # from source, but succeeds (~2 min), so it stays in the matrix.
          - os: windows-latest
            python-version: "3.14"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Type check against Python 3.11 floor
        run: pyright

      - name: Test
        run: python -m pytest tests -q
