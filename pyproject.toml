[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "quorumgit"
version = "0.1.0"
description = "Local multi-agent Git governance: task claims, leases, isolated worktrees, overlap detection, durable handoffs, and approval-gated protected operations."
requires-python = ">=3.11,<3.15"
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
# Storage is SQLite 3 via the standard-library sqlite3 module (SQLite >= 3.38).
dependencies = []

[project.optional-dependencies]
# ruff is pinned exactly: new releases enable new rules, and CI gates on it.
dev = ["pytest>=8", "ruff==0.16.9", "pyright>=1.1.380"]

[project.scripts]
quorumgit = "quorumgit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
quorumgit = ["migrations/*.sql"]

[tool.ruff]
# The supported floor: lint against the oldest interpreter we claim to run on.
target-version = "py311"
