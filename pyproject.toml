[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "quorumgit"
version = "0.1.0"
description = "Local multi-agent Git governance: task claims, leases, isolated worktrees, overlap detection, durable handoffs, and approval-gated protected operations."
requires-python = "~=3.14.5"
license = "MIT"
dependencies = [
    "psycopg[binary]>=3.2",
    "pg0-embedded==0.14.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
quorumgit = "quorumgit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
quorumgit = ["migrations/*.sql"]
