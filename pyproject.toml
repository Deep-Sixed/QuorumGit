[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "quorumgit"
version = "0.1.0"
description = "Local multi-agent Git governance: task claims, leases, isolated worktrees, overlap detection, durable handoffs, and approval-gated protected operations."
requires-python = ">=3.11,<3.15"
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "libsql==0.1.11",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "pyright>=1.1.380"]

[project.scripts]
quorumgit = "quorumgit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
quorumgit = ["migrations/*.sql"]

[tool.ruff]
# The supported floor: lint against the oldest interpreter we claim to run on.
target-version = "py311"
